services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DOCKER_DATABASE}
      MYSQL_USER: ${DOCKER_USER}
      MYSQL_PASSWORD: ${DOCKER_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./docker-entrypoint:/docker-entrypoint-initdb.d
   

    restart: unless-stopped
    networks:
      - backend

  api:
    build: ./vitaminesApi
    container_name: vitamines-api
    depends_on:
      - mysql
    environment:
      - API_DATABASE_HOST=${DOCKER_DATABASE_HOST}
      - API_DATABASE=${DOCKER_DATABASE}
      - API_USER=${DOCKER_USER}
      - API_PASSWORD=${DOCKER_PASSWORD}
    ports:
      - "3000:3000"
    networks:
      - backend

  frontend:
    build: ./vitamines
    container_name: vitamines-frontend
    depends_on:
      - api
    ports:
      - "80:8080" # Expose frontend on port 80 of the host machine
    networks:
      - backend

networks:
  backend:
    driver: bridge
